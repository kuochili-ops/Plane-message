<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>𓃥 白六廣宣飛機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;700&family=Orbitron:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b0b0e; color: #e0e0e6; overflow: hidden; width: 100vw; height: 100vh; position: fixed; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
        
        .header-bar {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px);
            padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .header-bar h1 { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; }
        .status-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 6px #00ff88; }
        
        .control-panel {
            position: absolute; top: 75px; left: 15px; width: calc(100vw - 30px); max-width: 360px; z-index: 10;
            background: rgba(18, 18, 22, 0.92); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease, opacity 0.3s ease; pointer-events: auto;
            max-height: calc(100vh - 100px); overflow-y: auto;
        }
        .control-panel.collapsed { transform: translateY(-120%) scale(0.95); opacity: 0; pointer-events: none; }
        
        .toggle-btn {
            position: absolute; top: 75px; left: 15px; z-index: 9;
            background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; width: 42px; height: 42px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: auto;
        }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .panel-header h2 { font-size: 0.95rem; color: #fff; font-weight: 700; }
        .close-panel { background: none; border: none; color: #8a8a9e; cursor: pointer; font-size: 1.4rem; padding: 4px 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: #a0a0b2; margin-bottom: 6px; }
        .form-control { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9rem; outline: none; }
        textarea.form-control { resize: none; height: 55px; }
        .color-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.06); padding: 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .color-picker-wrapper input[type="color"] { -webkit-appearance: none; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; background: none; }
        .color-picker-wrapper span { font-size: 0.75rem; color: #ccc; }
        
        .action-btn {
            width: 100%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 6px;
        }

        .touch-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(18, 18, 22, 0.8); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 12px; font-size: 0.75rem; color: #a0a0b2; white-space: nowrap; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .touch-hint span { color: #fff; font-weight: 600; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0e; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 16px; transition: opacity 0.5s ease;
        }
        .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #a0a0b2; font-size: 0.9rem; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>正在載入 𓃥 白六廣宣飛機...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="header-bar">
        <div class="status-dot"></div>
        <h1>𓃥 白六廣宣飛機</h1>
    </div>

    <button class="toggle-btn" id="toggleBtn" title="選單">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h2>布條內容設定</h2>
            <button class="close-panel" id="closePanel">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="bannerText">顯示訊息文字</label>
            <textarea id="bannerText" class="form-control">𓃥 白六廣宣訊息測試 ✨</textarea>
        </div>

        <div class="form-group">
            <label for="fontSelect">Google 字型樣式</label>
            <select id="fontSelect" class="form-control">
                <option value="'Noto Sans TC', sans-serif">思源黑體 (Noto Sans TC)</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Pacifico', cursive">Pacifico</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fontSize">字體大小 (px)</label>
            <input type="range" id="fontSize" class="form-control" min="14" max="32" value="20" style="padding:0; background:transparent;">
        </div>

        <div class="form-group">
            <label>色彩配置</label>
            <div class="color-pickers">
                <div class="color-picker-wrapper">
                    <input type="color" id="textColor" value="#ffffff">
                    <span>文字</span>
                </div>
                <div class="color-picker-wrapper">
                    <input type="color" id="bgColor" value="#e11d48">
                    <span>底色</span>
                </div>
            </div>
        </div>

        <button class="action-btn" id="updateBanner">更新拖曳布條</button>
    </div>

    <div class="touch-hint">
        <div><span>單指</span> 旋轉視角</div>
        <div><span>雙指</span> 縮放/平移</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0e);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
        dirLight.position.set(10, 30, 20);
        scene.add(dirLight);

        // 起始畫面視角設定（完美涵蓋飛機與布條）
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0.0, 4.0, 24.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0.0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.8;
        controls.update();

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const towingGroup = new THREE.Group();
        worldGroup.add(towingGroup);

        // 雲朵系統
        const cloudsGroup = new THREE.Group();
        scene.add(cloudsGroup);

        const cloudGeo = new THREE.DodecahedronGeometry(1.5, 1);
        const cloudMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.9,
            transparent: true,
            opacity: 0.18
        });

        const clouds = [];
        for (let i = 0; i < 6; i++) {
            const cloud = new THREE.Group();
            for (let j = 0; j < 3; j++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 1.5);
                puff.scale.set(1 + Math.random() * 0.8, 0.6 + Math.random() * 0.4, 0.8 + Math.random() * 0.5);
                cloud.add(puff);
            }
            cloud.position.set(
                (Math.random() - 0.5) * 45,
                (Math.random() - 0.5) * 10 - 2,
                -15 - Math.random() * 25
            );
            const s = 1.5 + Math.random() * 2.0;
            cloud.scale.set(s, s * 0.7, s);
            cloudsGroup.add(cloud);
            clouds.push({
                mesh: cloud,
                speed: 0.015 + Math.random() * 0.02
            });
        }

        function createFallbackPlane() {
            const plane = new THREE.Group();
            plane.rotation.y = Math.PI * 1.5;

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 4, 16), bodyMat);
            body.rotation.x = Math.PI / 2;
            plane.add(body);

            const wingMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            const topWing = new THREE.Mesh(new THREE.BoxGeometry(5, 0.1, 1.2), wingMat);
            topWing.position.set(0, 0.6, 0);
            plane.add(topWing);

            const botWing = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 1.0), wingMat);
            botWing.position.set(0, -0.4, 0);
            plane.add(botWing);

            const tailWing = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 1), wingMat);
            tailWing.position.set(0, 0.4, -1.8);
            plane.add(tailWing);

            return plane;
        }

        let airplaneModel = createFallbackPlane();
        airplaneModel.scale.set(1.5, 1.5, 1.5);
        airplaneModel.position.set(-4.5, 0, 0);
        towingGroup.add(airplaneModel);

        const tailAnchorPos = new THREE.Vector3(-3.784, 0.313, -0.182);

        const ropeLength = 0.3125;
        const ropeGeo = new THREE.CylinderGeometry(0.02, 0.02, ropeLength, 8);
        ropeGeo.rotateZ(Math.PI / 2);
        const ropeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const rope = new THREE.Mesh(ropeGeo, ropeMat);
        towingGroup.add(rope);

        const canvas = document.createElement('canvas');
        canvas.height = 64; 
        const ctx = canvas.getContext('2d');

        let bannerMesh = null;
        let originalPositions = [];
        let bannerWidth = 4.5;
        const bannerHeight = 0.55; 

        function rebuildBanner(text = "𓃥 白六廣宣訊息測試 ✨", textColor = "#ffffff", bgColor = "#e11d48", fontSizeVal = "20", fontFamily = "sans-serif") {
            ctx.font = `bold ${fontSizeVal * 2}px ${fontFamily}`;
            const textMetrics = ctx.measureText(text);
            const textPixelWidth = Math.max(textMetrics.width + 80, 256);
            canvas.width = textPixelWidth;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSizeVal * 2}px ${fontFamily}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const bannerTexture = new THREE.CanvasTexture(canvas);
            bannerTexture.needsUpdate = true;

            bannerWidth = Math.max(text.length * 0.35, 2.5);

            if (bannerMesh) {
                towingGroup.remove(bannerMesh);
                bannerMesh.geometry.dispose();
            }

            const bannerGeo = new THREE.PlaneGeometry(bannerWidth, bannerHeight, 20, 5);
            bannerGeo.translate(bannerWidth / 2, 0, 0);

            const bannerMat = new THREE.MeshStandardMaterial({ 
                map: bannerTexture, 
                side: THREE.DoubleSide,
                roughness: 0.5 
            });
            bannerMesh = new THREE.Mesh(bannerGeo, bannerMat);
            towingGroup.add(bannerMesh);

            originalPositions = [];
            const posAttr = bannerMesh.geometry.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                originalPositions.push(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
            }
        }

        rebuildBanner();

        // 用於處理模型內建動畫（如螺旋槳轉動）的變數
        let mixer = null;

        const loader = new GLTFLoader();
        loader.load(
            'stylized_ww1_plane.glb',
            (gltf) => {
                const glbModel = gltf.scene;
                const box = new THREE.Box3().setFromObject(glbModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                glbModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 6.0 / (maxDim > 0 ? maxDim : 1);
                glbModel.scale.multiplyScalar(scaleFactor);

                glbModel.rotation.y = Math.PI * 1.5;

                towingGroup.remove(airplaneModel);
                airplaneModel = glbModel;
                airplaneModel.position.set(-4.5, 0, 0);
                towingGroup.add(airplaneModel);

                // 檢查並播放模型內建的動畫（支援螺旋槳等轉動效果）
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(airplaneModel);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }
            },
            undefined,
            (error) => {
                console.log('使用內建 3D 飛機模型。');
            }
        );

        setTimeout(() => {
            const loaderEl = document.getElementById('loading');
            if (loaderEl) {
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.remove(), 500);
            }
        }, 500);

        const controlPanel = document.getElementById('controlPanel');
        document.getElementById('toggleBtn').addEventListener('click', () => controlPanel.classList.toggle('collapsed'));
        document.getElementById('closePanel').addEventListener('click', () => controlPanel.classList.add('collapsed'));

        const bannerText = document.getElementById('bannerText');
        const fontSelect = document.getElementById('fontSelect');
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const bgColorInput = document.getElementById('bgColor');

        document.getElementById('updateBanner').addEventListener('click', () => {
            rebuildBanner(
                bannerText.value || '𓃥 白六廣宣訊息',
                textColorInput.value,
                bgColorInput.value,
                fontSizeInput.value,
                fontSelect.value
            );
            controlPanel.classList.add('collapsed');
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const t = clock.getElapsedTime();

            // 更新模型內建動畫（讓螺旋槳轉動）
            if (mixer) {
                mixer.update(delta);
            }

            if (worldGroup) {
                worldGroup.position.y = Math.sin(t * 2) * 0.15;
                worldGroup.rotation.z = Math.sin(t * 1.5) * 0.03;
            }

            // 雲朵漂移
            clouds.forEach(c => {
                c.mesh.position.x += c.speed;
                if (c.mesh.position.x > 30) {
                    c.mesh.position.x = -30;
                    c.mesh.position.y = (Math.random() - 0.5) * 10 - 2;
                }
            });

            rope.position.set(tailAnchorPos.x + ropeLength / 2, tailAnchorPos.y, tailAnchorPos.z);
            if (bannerMesh) {
                bannerMesh.position.set(tailAnchorPos.x + ropeLength, tailAnchorPos.y, tailAnchorPos.z);
            }

            if (bannerMesh && originalPositions.length > 0) {
                const posAttr = bannerMesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const ox = originalPositions[i * 3];
                    const oy = originalPositions[i * 3 + 1];
                    const oz = originalPositions[i * 3 + 2];

                    const waveFactor = ox / bannerWidth; 
                    const waveZ = Math.sin(t * 6 - ox * 2.5) * 0.15 * waveFactor;
                    const waveY = Math.cos(t * 4 - ox * 1.5) * 0.08 * waveFactor;

                    posAttr.setXYZ(i, ox, oy + waveY, oz + waveZ);
                }
                posAttr.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
