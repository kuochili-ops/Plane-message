<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 飛機訊息拖曳互動 - 絕對可見強制版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;700&family=Orbitron:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b0b0e; color: #e0e0e6; overflow: hidden; width: 100vw; height: 100vh; position: fixed; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
        
        .header-bar {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px);
            padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .header-bar h1 { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; }
        .status-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 6px #00ff88; }
        
        .control-panel {
            position: absolute; top: 75px; left: 15px; width: calc(100vw - 30px); max-width: 340px; z-index: 10;
            background: rgba(18, 18, 22, 0.92); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease, opacity 0.3s ease; pointer-events: auto;
            max-height: calc(100vh - 160px); overflow-y: auto;
        }
        .control-panel.collapsed { transform: translateY(-120%) scale(0.95); opacity: 0; pointer-events: none; }
        
        .toggle-btn {
            position: absolute; top: 75px; left: 15px; z-index: 9;
            background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; width: 42px; height: 42px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: auto;
        }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .panel-header h2 { font-size: 0.95rem; color: #fff; font-weight: 700; }
        .close-panel { background: none; border: none; color: #8a8a9e; cursor: pointer; font-size: 1.4rem; padding: 4px 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: #a0a0b2; margin-bottom: 6px; }
        .form-control { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9rem; outline: none; }
        textarea.form-control { resize: none; height: 55px; }
        .color-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.06); padding: 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .color-picker-wrapper input[type="color"] { -webkit-appearance: none; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; background: none; }
        .color-picker-wrapper span { font-size: 0.75rem; color: #ccc; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 6px; }
        
        .touch-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(18, 18, 22, 0.8); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 12px; font-size: 0.75rem; color: #a0a0b2; white-space: nowrap; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .touch-hint span { color: #fff; font-weight: 600; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0e; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 16px; transition: opacity 0.5s ease;
        }
        .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #a0a0b2; font-size: 0.9rem; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>正在初始化 3D 空間與渲染引擎...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="header-bar">
        <div class="status-dot"></div>
        <h1>SkyBanner 3D</h1>
    </div>

    <button class="toggle-btn" id="toggleBtn" title="選單">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h2>布條內容設定</h2>
            <button class="close-panel" id="closePanel">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="bannerText">顯示訊息文字</label>
            <textarea id="bannerText" class="form-control">飛機拖曳訊息測試 ✨</textarea>
        </div>

        <div class="form-group">
            <label for="fontSelect">字型樣式</label>
            <select id="fontSelect" class="form-control">
                <option value="'Noto Sans TC', sans-serif">思源黑體 (Noto Sans TC)</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Pacifico', cursive">Pacifico</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fontSize">字體大小 (px)</label>
            <input type="range" id="fontSize" class="form-control" min="14" max="32" value="20" style="padding:0; background:transparent;">
        </div>

        <div class="form-group">
            <label>色彩配置</label>
            <div class="color-pickers">
                <div class="color-picker-wrapper">
                    <input type="color" id="textColor" value="#ffffff">
                    <span>文字</span>
                </div>
                <div class="color-picker-wrapper">
                    <input type="color" id="bgColor" value="#e11d48">
                    <span>底色</span>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="updateBanner">更新拖曳布條</button>
    </div>

    <div class="touch-hint">
        <div><span>單指</span> 旋轉視角</div>
        <div><span>雙指</span> 縮放/平移</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0e);

        // 超強力全方位燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3.5);
        dirLight.position.set(10, 30, 20);
        scene.add(dirLight);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.style.position = 'absolute';
        cssRenderer.domElement.style.top = '0';
        cssRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(cssRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.8;
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };

        // 建立主群組
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // 1. 建立 HTML 拖曳布條
        const bannerElement = document.createElement('div');
        bannerElement.innerHTML = `
            <div style="display: flex; align-items: center; pointer-events: auto; cursor: pointer;" id="bannerWrapper">
                <div style="width: 70px; height: 3px; background: rgba(255,255,255,0.9); box-shadow: 0 0 6px rgba(0,0,0,0.8);"></div>
                <div id="bannerContent" style="padding: 12px 20px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: #ffffff; background-color: #e11d48; white-space: nowrap;">
                    飛機拖曳訊息測試 ✨
                </div>
            </div>
        `;
        const bannerCSSObject = new CSS3DObject(bannerElement);
        bannerCSSObject.scale.set(0.08, 0.08, 0.08);
        bannerCSSObject.position.set(-3.5, 0, 0);
        worldGroup.add(bannerCSSObject);

        // 2. 建立強制保證看得見的備用幾何飛機（紅色雙翼造型），確保 GLB 讀取失敗或路徑不對時畫面絕對有飛機
        const planeGroup = new THREE.Group();
        
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 3.5, 16);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        planeGroup.add(bodyMesh);

        const wingGeo = new THREE.BoxGeometry(4.5, 0.1, 1.2);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
        const topWing = new THREE.Mesh(wingGeo, wingMat);
        topWing.position.set(0, 0.6, 0);
        planeGroup.add(topWing);

        const botWing = new THREE.Mesh(wingGeo, wingMat);
        botWing.position.set(0, -0.6, 0);
        planeGroup.add(botWing);

        // 預先將備用飛機加入場景群組
        worldGroup.add(planeGroup);

        // 3. 嘗試讀取您的 GLB 檔案，如果成功載入則替換掉備用飛機
        const loader = new GLTFLoader();
        loader.load(
            'stylized_ww1_plane.glb',
            (gltf) => {
                const glbModel = gltf.scene;

                glbModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                            child.material.roughness = 0.4;
                        }
                    }
                });

                // 自動置中與縮放
                const box = new THREE.Box3().setFromObject(glbModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                glbModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 4.5 / (maxDim > 0 ? maxDim : 1);
                glbModel.scale.multiplyScalar(scaleFactor);

                // 移除備用幾何，換上真實的 GLB 模型
                planeGroup.clear();
                planeGroup.add(glbModel);

                // 依據模型大小精準對齊布條位置
                bannerCSSObject.position.set(- (size.x * scaleFactor * 0.5) - 3.0, 0, 0);
                
                console.log('GLB 模型載入成功並已替換！');
            },
            undefined,
            (error) => {
                console.warn('無法載入 GLB 檔案，已自動使用內建 3D 飛機模型替代:', error);
            }
        );

        // 移除載入遮罩
        setTimeout(() => {
            const loaderEl = document.getElementById('loading');
            if (loaderEl) {
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.remove(), 500);
            }
        }, 600);

        // UI 互動控制
        const controlPanel = document.getElementById('controlPanel');
        document.getElementById('toggleBtn').addEventListener('click', () => controlPanel.classList.toggle('collapsed'));
        document.getElementById('closePanel').addEventListener('click', () => controlPanel.classList.add('collapsed'));

        const bannerText = document.getElementById('bannerText');
        const fontSelect = document.getElementById('fontSelect');
        const fontSize = document.getElementById('fontSize');
        const textColor = document.getElementById('textColor');
        const bgColor = document.getElementById('bgColor');
        const bannerContent = document.getElementById('bannerContent');

        document.getElementById('updateBanner').addEventListener('click', () => {
            bannerContent.textContent = bannerText.value || 'SkyBanner';
            bannerContent.style.fontFamily = fontSelect.value;
            bannerContent.style.fontSize = fontSize.value + 'px';
            bannerContent.style.color = textColor.value;
            bannerContent.style.backgroundColor = bgColor.value;
            controlPanel.classList.add('collapsed');
        });

        bannerContent.addEventListener('click', () => controlPanel.classList.remove('collapsed'));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (worldGroup) {
                worldGroup.position.y = Math.sin(t * 2) * 0.15;
                worldGroup.rotation.z = Math.sin(t * 1.5) * 0.03;
            }
            controls.update();
            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
