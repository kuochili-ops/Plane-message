<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 飛機訊息拖曳互動展示 - 網格除錯版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;700&family=Orbitron:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b0b0e; color: #e0e0e6; overflow: hidden; width: 100vw; height: 100vh; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .header-bar {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px);
            padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .header-bar h1 { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .status-dot { width: 10px; height: 10px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }
        .control-panel {
            position: absolute; top: 85px; left: 20px; width: 340px; z-index: 10;
            background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease, opacity 0.3s ease; pointer-events: auto;
        }
        .control-panel.collapsed { transform: translateX(-370px); opacity: 0; pointer-events: none; }
        .toggle-btn {
            position: absolute; top: 85px; left: 20px; z-index: 9;
            background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; width: 44px; height: 44px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: auto;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .panel-header h2 { font-size: 1rem; color: #fff; font-weight: 700; }
        .close-panel { background: none; border: none; color: #8a8a9e; cursor: pointer; font-size: 1.2rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #a0a0b2; margin-bottom: 6px; }
        .form-control { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.9rem; outline: none; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        .color-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.06); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .color-picker-wrapper input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; background: none; }
        .color-picker-wrapper span { font-size: 0.8rem; color: #ccc; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0e; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 16px; transition: opacity 0.5s ease;
        }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #a0a0b2; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>正在載入 3D 模型與建立除錯網格...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="header-bar">
        <div class="status-dot"></div>
        <h1>SkyBanner 3D - 模型除錯與網格版</h1>
    </div>

    <button class="toggle-btn" id="toggleBtn" title="開啟/收合設定面板">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h2>布條內容設定</h2>
            <button class="close-panel" id="closePanel">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="bannerText">顯示訊息文字</label>
            <textarea id="bannerText" class="form-control">飛機拖曳訊息測試 ✨</textarea>
        </div>

        <div class="form-group">
            <label for="fontSelect">字型樣式</label>
            <select id="fontSelect" class="form-control">
                <option value="'Noto Sans TC', sans-serif">思源黑體 (Noto Sans TC)</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Pacifico', cursive">Pacifico</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fontSize">字體大小 (px)</label>
            <input type="range" id="fontSize" class="form-control" min="14" max="36" value="22" style="padding:0; background:transparent;">
        </div>

        <div class="form-group">
            <label>色彩配置</label>
            <div class="color-pickers">
                <div class="color-picker-wrapper">
                    <input type="color" id="textColor" value="#ffffff">
                    <span>文字</span>
                </div>
                <div class="color-picker-wrapper">
                    <input type="color" id="bgColor" value="#e11d48">
                    <span>底色</span>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="updateBanner">更新拖曳布條</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0e);

        // 燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.style.position = 'absolute';
        cssRenderer.domElement.style.top = '0';
        cssRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(cssRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 加入三軸輔助線 (紅:X, 綠:Y, 藍:Z) 與大地格線
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);

        const gridHelper = new THREE.GridHelper(30, 30, 0x3b82f6, 0x222228);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // 建立 HTML 布條
        const bannerElement = document.createElement('div');
        bannerElement.innerHTML = `
            <div style="display: flex; align-items: center; pointer-events: auto; cursor: pointer;" id="bannerWrapper">
                <div style="width: 80px; height: 3px; background: rgba(255,255,255,0.7); box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>
                <div id="bannerContent" style="padding: 12px 24px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); font-family: 'Noto Sans TC', sans-serif; font-size: 22px; color: #ffffff; background-color: #e11d48; white-space: nowrap;">
                    飛機拖曳訊息測試 ✨
                </div>
            </div>
        `;
        const bannerCSSObject = new CSS3DObject(bannerElement);
        bannerCSSObject.scale.set(0.08, 0.08, 0.08);
        scene.add(bannerCSSObject);

        let airplaneModel = null;
        const loader = new GLTFLoader();

        loader.load(
            'stylized_ww1_plane.glb',
            (gltf) => {
                airplaneModel = gltf.scene;

                // 強制套用材質修復（部分 GLB 匯出時如果材質是黑色或透明會直接看不見）
                airplaneModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                    }
                });

                // 自動置中與縮放
                const box = new THREE.Box3().setFromObject(airplaneModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                airplaneModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 5.0 / (maxDim > 0 ? maxDim : 1);
                airplaneModel.scale.multiplyScalar(scaleFactor);

                const airplaneGroup = new THREE.Group();
                airplaneGroup.add(airplaneModel);

                // 將布條放置在飛機後方
                bannerCSSObject.position.set(-3.5, 0, 0);
                airplaneGroup.add(bannerCSSObject);

                scene.add(airplaneGroup);

                // 相機對準飛機
                controls.target.set(0, 0, 0);
                camera.position.set(6, 3, 10);
                controls.update();

                // 移除讀取遮罩
                const loaderEl = document.getElementById('loading');
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.remove(), 500);
            },
            undefined,
            (error) => {
                console.error('載入模型錯誤：', error);
                document.querySelector('#loading p').innerHTML = `無法載入 <b>stylized_ww1_plane.glb</b>。<br>請確認檔案是否與 index.html 放在同一目錄。`;
                document.querySelector('.spinner').style.display = 'none';
            }
        );

        // UI 互動
        document.getElementById('toggleBtn').addEventListener('click', () => document.getElementById('controlPanel').classList.toggle('collapsed'));
        document.getElementById('closePanel').addEventListener('click', () => document.getElementById('controlPanel').classList.add('collapsed'));

        const bannerText = document.getElementById('bannerText');
        const fontSelect = document.getElementById('fontSelect');
        const fontSize = document.getElementById('fontSize');
        const textColor = document.getElementById('textColor');
        const bgColor = document.getElementById('bgColor');
        const bannerContent = document.getElementById('bannerContent');

        document.getElementById('updateBanner').addEventListener('click', () => {
            bannerContent.textContent = bannerText.value || 'SkyBanner';
            bannerContent.style.fontFamily = fontSelect.value;
            bannerContent.style.fontSize = fontSize.value + 'px';
            bannerContent.style.color = textColor.value;
            bannerContent.style.backgroundColor = bgColor.value;
        });

        bannerContent.addEventListener('click', () => document.getElementById('controlPanel').classList.remove('collapsed'));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (airplaneModel) {
                airplaneModel.position.y = Math.sin(t * 2) * 0.15;
                airplaneModel.rotation.z = Math.sin(t * 1.5) * 0.03;
            }
            controls.update();
            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
